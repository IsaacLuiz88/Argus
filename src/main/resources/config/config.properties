# Valores padrao (servidor na mesma maquina). Para apontar para outro servidor SEM
# recompilar o plugin, crie o arquivo ~/.argus/config.properties (na pasta do usuario) e
# coloque la apenas o que muda, por exemplo:
#
#   server.url=https://argus.onrender.com
#
# server.url resolve HTTP e WebSocket de uma vez (https vira wss). Se ele estiver
# presente, vale mais que server.host/port/base/event/session/ws abaixo.
server.host=localhost
server.port=8080

server.base=http://${server.host}:${server.port}

server.event=${server.base}/api/event
server.session=${server.base}/api/session/start
server.ws=ws://${server.host}:${server.port}/ws-command

# ArgusVision - iniciado automaticamente logo apos o login do aluno.
# Preencha os caminhos abaixo (especificos de cada maquina) e mude enabled para true.
argusvision.enabled=false
argusvision.jar=
argusvision.javaHome=
argusvision.libraryPath=